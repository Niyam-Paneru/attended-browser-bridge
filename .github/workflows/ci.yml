name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check source
        run: |
          for file in src/*.js; do node --check "$file"; done
      - name: Run behavior tests
        run: npm test
      - name: Verify public documentation
        run: |
          test -s docs/workflow.svg
          test -s SECURITY.md
          test -s PROVENANCE.md
