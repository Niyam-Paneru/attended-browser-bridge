<svg xmlns="http://www.w3.org/2000/svg" width="800" height="462" viewBox="0 0 800 462" role="img" aria-labelledby="title desc">
 <title id="title">One real browser write, then independently verify</title><desc id="desc">The synthetic operator grant and observed page enter the public policy core, which journals intent before dispatch. The adapter releases a single form POST to a local site. A separate readback checks the durable server record even after browser failure. Unavailable or mismatched readback blocks repeat.</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#456079"/></marker></defs>
 <rect width="800" height="462" rx="16" fill="#f5f8fc"/><g font-family="system-ui, sans-serif" fill="#14253b">
  <text x="32" y="37" font-size="21" font-weight="700">The ticket submission boundary</text><text x="32" y="61" font-size="13" fill="#4b6079">Public review fixture • isolated Chromium and loopback service</text>
  <g fill="#fff" stroke="#b9c8d9" stroke-width="1.5"><rect x="32" y="90" width="216" height="74" rx="10"/><rect x="292" y="90" width="216" height="74" rx="10"/><rect x="552" y="90" width="216" height="74" rx="10"/><rect x="32" y="208" width="216" height="80" rx="10"/><rect x="292" y="208" width="216" height="80" rx="10"/><rect x="552" y="208" width="216" height="80" rx="10"/></g>
  <g font-size="15" font-weight="700"><text x="48" y="117">Actual Chromium page</text><text x="308" y="117">Public policy core</text><text x="568" y="117">Durable intent ledger</text><text x="48" y="235">Browser adapter</text><text x="308" y="235">Local ticket service</text><text x="568" y="235">Independent readback</text></g>
  <g font-size="12" fill="#4b6079"><text x="48" y="137">Observe form + revision</text><text x="48" y="152">Synthetic operator grant</text><text x="308" y="137">Check scope, expiry, freshness</text><text x="308" y="152">Decide whether to reserve</text><text x="568" y="137">Reserve before dispatch</text><text x="568" y="152">Survives executor exit</text><text x="48" y="255">Recheck; gate exact POST</text><text x="48" y="270">Record dispatch + response</text><text x="308" y="255">Persist effect / rejection</text><text x="308" y="270">Can drop response afterward</text><text x="568" y="255">Read matching ticket record</text><text x="568" y="270">No repeat POST</text></g>
  <g fill="none" stroke="#456079" stroke-width="2" marker-end="url(#arrow)"><path d="M248 127H285"/><path d="M508 127H545"/><path d="M660 164V184H140V201"/><path d="M248 247H285"/><path d="M508 247H545"/><path d="M660 288V315H400V331"/></g>
  <g><rect x="32" y="337" width="236" height="91" rx="10" fill="#e3f5ec" stroke="#85c4a1"/><rect x="282" y="337" width="236" height="91" rx="10" fill="#fcece9" stroke="#d6a49b"/><rect x="532" y="337" width="236" height="91" rx="10" fill="#fff3d8" stroke="#d8b766"/></g>
  <g font-size="15" font-weight="700"><text x="48" y="365">Confirmed</text><text x="298" y="365">Rejected</text><text x="548" y="365">Unresolved</text></g><g font-size="12"><text x="48" y="385">Exact saved record</text><text x="48" y="405">Block replay</text><text x="298" y="385">Explicit matching rejection</text><text x="298" y="405">Block replay</text><text x="548" y="385">Absent / unavailable / mismatch</text><text x="548" y="405">Stop; read-only recovery</text></g>
 </g></svg>
