<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Attended browser write workflow</title>
<desc id="d">A request is authorized, tied to a fresh snapshot, given one effect intent, written once, and then verified.</desc>
<rect width="1200" height="320" fill="#0b1020"/>
<text x="54" y="52" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">One write. Then read. No panic-double-clicking.</text>
<path d="M86 170 H1112" stroke="#263248" stroke-width="5" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <g transform="translate(110 0)"><circle cy="170" r="27" fill="#60a5fa"/><text y="177" font-size="18" font-weight="700">1</text><text y="220" fill="#dbeafe" font-size="14">authorize</text></g>
  <g transform="translate(290 0)"><circle cy="170" r="27" fill="#38bdf8"/><text y="177" font-size="18" font-weight="700">2</text><text y="220" fill="#dbeafe" font-size="14">fresh snapshot</text></g>
  <g transform="translate(470 0)"><circle cy="170" r="27" fill="#22d3ee"/><text y="177" font-size="18" font-weight="700">3</text><text y="220" fill="#dbeafe" font-size="14">record intent</text></g>
  <g transform="translate(650 0)"><circle cy="170" r="27" fill="#a78bfa"/><text y="177" font-size="18" font-weight="700">4</text><text y="220" fill="#ede9fe" font-size="14">write once</text></g>
  <g transform="translate(830 0)"><circle cy="170" r="27" fill="#c084fc"/><text y="177" font-size="18" font-weight="700">5</text><text y="220" fill="#ede9fe" font-size="14">read back</text></g>
  <g transform="translate(1010 0)"><circle cy="170" r="27" fill="#4ade80"/><text y="177" font-size="18" font-weight="700">6</text><text y="220" fill="#dcfce7" font-size="14">commit effect</text></g>
</g>
<path d="M830 140 C850 90 985 90 1010 140" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8"/>
<text x="920" y="90" fill="#fbbf24" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">cannot verify? mark ambiguous + stop</text>
<text x="1140" y="286" fill="#64748b" font-family="Arial,sans-serif" font-size="13" text-anchor="end">The second click is not a recovery strategy.</text>
</svg>