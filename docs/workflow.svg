<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Attended browser write boundary</title><desc id="d">A browser write passes explicit permission, a fresh snapshot, and an effect-intent boundary before one write; ambiguous readback exits to stop.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="56" y="62" fill="#71716a" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">ATTENDED BROWSER BRIDGE</text>
<text x="56" y="105" fill="#171714" font-family="Georgia,serif" font-size="34">One write. Then read. No panic double-clicking.</text>

<rect x="58" y="170" width="190" height="100" rx="14" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="80" y="202" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">REQUEST</text>
<text x="80" y="234" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">action + target</text>

<rect x="320" y="135" width="245" height="170" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="345" y="168" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">BEFORE WRITE</text>
<text x="345" y="201" fill="#171714" font-family="Georgia,serif" font-size="24">Can this be attempted?</text>
<text x="345" y="240" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">grant still valid</text>
<text x="345" y="266" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">snapshot still fresh</text>

<rect x="640" y="135" width="220" height="170" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="665" y="168" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">EFFECT LEDGER</text>
<text x="665" y="201" fill="#171714" font-family="Georgia,serif" font-size="24">One intent.</text>
<text x="665" y="240" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">new → write once</text>
<text x="665" y="266" fill="#a4243b" font-family="Arial,sans-serif" font-size="14">ambiguous → stop</text>

<rect x="935" y="170" width="205" height="100" rx="14" fill="#e4edb0" stroke="#596e35" stroke-width="2"/>
<text x="960" y="202" fill="#596e35" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">AFTER WRITE</text>
<text x="960" y="234" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">read back + commit</text>

<g stroke="#171714" stroke-width="2" fill="none"><path d="M248 220 H320"/><path d="M565 220 H640"/><path d="M860 220 H935"/></g>
<g fill="#171714"><path d="M312 214 l10 6 -10 6z"/><path d="M632 214 l10 6 -10 6z"/><path d="M927 214 l10 6 -10 6z"/></g>

<rect x="320" y="360" width="540" height="74" rx="14" fill="#f1d9dc" stroke="#a4243b" stroke-width="2"/>
<text x="345" y="390" fill="#a4243b" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">IF THE RESULT IS UNCLEAR</text>
<text x="345" y="418" fill="#171714" font-family="Georgia,serif" font-size="20">Mark it ambiguous. Stop. Verify manually.</text>
</svg>