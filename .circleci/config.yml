version: 2.1

orbs:
  node: circleci/node@5

jobs:
  verify:
    executor: node/default
    steps:
      - checkout
      - run:
          name: Syntax-check source
          command: |
            for file in src/*.js; do
              node --check "$file"
            done
      - run:
          name: Run behavior tests
          command: npm test
      - run:
          name: Verify public proof structure
          command: |
            test -s docs/workflow.svg
            test -s docs/overview.md
            test -s docs/decisions.md
            test -s docs/invariants.md
            test -s docs/failure-modes.md
            test -s SECURITY.md
            test -s PROVENANCE.md

  verify-browser-review:
    docker:
      - image: mcr.microsoft.com/playwright:v1.62.1-noble
    resource_class: small
    steps:
      - checkout
      - run:
          name: Build and verify the exact review archive in clean folders
          command: |
            set -eu
            mkdir -p /tmp/osmium-review/first /tmp/osmium-review/final /tmp/osmium-review/artifacts
            git rev-parse HEAD > /tmp/osmium-review/revision.txt
            git archive --format=zip --prefix=attended-browser-proof/ HEAD README.md LICENSE SECURITY.md PROVENANCE.md package.json package-lock.json src test examples docs/browser-demo.svg > /tmp/osmium-review/source.zip
            python3 -m zipfile -e /tmp/osmium-review/source.zip /tmp/osmium-review/first
            cd /tmp/osmium-review/first/attended-browser-proof
            npm ci
            npx playwright install chromium
            npm test
            npm run demo -- browser-evidence.json
            mkdir -p /tmp/osmium-review/first/attended-browser-proof/evidence
            mv browser-evidence.json evidence/browser-evidence.json
            cp /tmp/osmium-review/revision.txt SOURCE_REVISION.txt
            # Exclude installed packages; use explicit public source paths only.
            cd /tmp/osmium-review/first
            python3 - <<'PY'
            import pathlib, zipfile
            root = pathlib.Path('attended-browser-proof')
            target = '/tmp/osmium-review/artifacts/Attended_Browser_Bridge_Chromium_Proof_2026-11-20.zip'
            with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED) as out:
                for path in sorted(root.rglob('*')):
                    if path.is_file() and 'node_modules' not in path.parts:
                        out.write(path, path.as_posix())
            PY
            python3 -m zipfile -e /tmp/osmium-review/artifacts/Attended_Browser_Bridge_Chromium_Proof_2026-11-20.zip /tmp/osmium-review/final
            cd /tmp/osmium-review/final/attended-browser-proof
            npm ci
            npx playwright install chromium
            npm test
            npm run demo -- /tmp/osmium-review/artifacts/final-extracted-browser-evidence.json
            sha256sum /tmp/osmium-review/artifacts/Attended_Browser_Bridge_Chromium_Proof_2026-11-20.zip | tee /tmp/osmium-review/artifacts/SHA256.txt
          no_output_timeout: 8m
      - store_artifacts:
          path: /tmp/osmium-review/artifacts

workflows:
  public-proof:
    jobs:
      - verify:
          filters:
            branches:
              ignore: osmium/real-browser-recovery
      - verify-browser-review:
          filters:
            branches:
              only: osmium/real-browser-recovery
