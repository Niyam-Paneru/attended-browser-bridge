version: 2.1

orbs:
  node: circleci/node@5

jobs:
  verify:
    executor: node/default
    steps:
      - checkout
      - run:
          name: Syntax-check source
          command: |
            for file in src/*.js; do
              node --check "$file"
            done
      - run:
          name: Run behavior tests
          command: npm test
      - run:
          name: Verify public workflow visual
          command: test -s docs/workflow.svg

workflows:
  public-proof:
    jobs:
      - verify
